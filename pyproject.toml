[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-contagion-engine"
version = "0.1.0"
description = "Temporal payment-network system: learns merchant dependencies, simulates liquidity shocks, predicts contagion, optimizes interventions."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "networkx>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "torch-geometric>=2.5",
]
opt = [
    "ortools>=9.10",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
lce = "lce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: long-running tests",
    "requires_torch: needs the optional torch/PyG extra",
    "requires_ortools: needs the optional ortools extra",
    "requires_postgres: needs a live PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["lce"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "torch_geometric.*", "ortools.*", "networkx.*", "scipy.*"]
ignore_errors = true
