[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# sqlalchemy.url is intentionally omitted: migrations/env.py reads DATABASE_URL
# from the application settings so migrations and the app can never disagree,
# and no credentials are ever committed to this file.

[post_write_hooks]
# Format newly generated revisions. Run `ruff format migrations/` manually if
# ruff is not installed as a console entry point in this environment.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
